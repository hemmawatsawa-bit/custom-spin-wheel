name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fill in version and manifest URLs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" \
             --arg url "$REPO_URL" \
             --arg man "$REPO_URL/releases/latest/download/module.json" \
             --arg dl "$REPO_URL/releases/download/${GITHUB_REF_NAME}/module.zip" \
             '.version=$v | .url=$url | .manifest=$man | .download=$dl' \
             module.json > module.tmp && mv module.tmp module.json

      - name: Build zip
        run: zip -r module.zip module.json scripts styles languages

      - name: Attach files to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
